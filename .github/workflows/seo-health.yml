name: SEO health

# Daily, zero-vendor smoke test for the live public SEO surface.
# It checks only things the site controls: crawlability, sitemap membership,
# canonical URLs, and structured data on key pages.

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: seo-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://www.mayaallan.com
      INCIDENT_LABEL: seo-health-incident
    steps:
      - name: Probe public SEO surface
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set +e
          failures=""

          fetch() {
            curl -fsSL --max-time 30 -A "MayaAllanSEOHealth/1.0" "$1"
          }

          robots="$(fetch "$BASE_URL/robots.txt" 2>/dev/null)"
          if [ -z "$robots" ]; then
            failures="$failures\n- /robots.txt: request failed or empty"
          else
            echo "$robots" | grep -Fq "Sitemap: $BASE_URL/sitemap.xml" ||
              failures="$failures\n- /robots.txt: canonical sitemap declaration missing"
            echo "$robots" | grep -Eq 'Disallow: /?(belief-inquiry|nervous-system-reset|integration-reflection)' &&
              failures="$failures\n- /robots.txt: a primary tool is disallowed"
          fi

          sitemap="$(fetch "$BASE_URL/sitemap.xml" 2>/dev/null)"
          if [ -z "$sitemap" ]; then
            failures="$failures\n- /sitemap.xml: request failed or empty"
          else
            for path in /belief-inquiry /nervous-system-reset /integration-reflection /about /books/psilocybin-integration-guide; do
              echo "$sitemap" | grep -Fq "$BASE_URL$path" ||
                failures="$failures\n- /sitemap.xml: missing $path"
            done
          fi

          for path in /belief-inquiry /nervous-system-reset /integration-reflection; do
            html="$(fetch "$BASE_URL$path" 2>/dev/null)"
            if [ -z "$html" ]; then
              failures="$failures\n- $path: request failed or empty"
              continue
            fi
            echo "$html" | grep -Fq '"SoftwareApplication"' ||
              failures="$failures\n- $path: SoftwareApplication JSON-LD missing"
            echo "$html" | grep -Fq "rel=\"canonical\" href=\"$BASE_URL$path\"" ||
              failures="$failures\n- $path: expected canonical URL missing"
          done

          about="$(fetch "$BASE_URL/about" 2>/dev/null)"
          if [ -z "$about" ]; then
            failures="$failures\n- /about: request failed or empty"
          else
            echo "$about" | grep -Fq '"ProfilePage"' ||
              failures="$failures\n- /about: ProfilePage JSON-LD missing"
          fi

          nonwww_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://mayaallan.com/)"
          if [ "$nonwww_status" != "301" ] && [ "$nonwww_status" != "308" ]; then
            failures="$failures\n- non-www homepage: expected permanent redirect, got HTTP $nonwww_status"
          fi

          if [ -n "$failures" ]; then
            printf '%b\n' "$failures" | sed '/^$/d'
            {
              echo 'details<<SEO_EOF'
              printf '%b\n' "$failures" | sed '/^$/d'
              echo 'SEO_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Live SEO surface passed."

      - name: Open or update SEO incident on failure
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          INCIDENT_LABEL: \${{ env.INCIDENT_LABEL }}
          DETAILS: \${{ steps.probe.outputs.details }}
        with:
          script: |
            const { INCIDENT_LABEL, DETAILS } = process.env
            const ts = new Date().toISOString()

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: INCIDENT_LABEL,
              })
            } catch (error) {
              if (error.status !== 404) throw error
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: INCIDENT_LABEL,
                color: 'b60205',
                description: 'Automatic live SEO health-check incident',
              })
            }
            const runUrl = \`\${process.env.GITHUB_SERVER_URL}/\${process.env.GITHUB_REPOSITORY}/actions/runs/\${process.env.GITHUB_RUN_ID}\`
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: INCIDENT_LABEL,
              per_page: 1,
            })
            const body = [
              \`**SEO health failure at \${ts}**\`,
              '',
              DETAILS || '- Probe failed without details',
              '',
              \`Workflow: \${runUrl}\`,
            ].join('\n')

            if (issues.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'SEO health check failing',
                labels: [INCIDENT_LABEL],
                body,
              })
            }

      - name: Close SEO incidents on recovery
        if: steps.probe.outcome == 'success'
        uses: actions/github-script@v7
        env:
          INCIDENT_LABEL: \${{ env.INCIDENT_LABEL }}
        with:
          script: |
            const { INCIDENT_LABEL } = process.env
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: INCIDENT_LABEL,
              per_page: 20,
            })
            if (!issues.length) return
            const ts = new Date().toISOString()
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: \`SEO health check recovered at \${ts}. Closing.\`,
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              })
            }
